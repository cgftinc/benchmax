[project]
name = "benchmax"
version = "0.1.2.dev24"
description = "Framework-Agnostic RL Environments for LLM Fine-Tuning"
readme = "README.md"
authors = [{ name = "castie@castform.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.1",
    "asyncio>=4.0.0",
    "cloudpickle>=3.0.0",
    "datasets>=4.0.0",
    "job-telemetry>=0.1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = [
    "fastmcp~=2.12.0",
    "pyjwt>=2.10.1",
]
skypilot = [
    "skypilot[aws,gcp]~=0.8.1",
    "pip>=25.3",
    "msrestazure>=0.6.4.post1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.2",
]
mcp = [
    "fastmcp~=2.12.0",
    "pyjwt>=2.10.1",
]
skypilot = [
    "skypilot[aws,gcp]~=0.8.1",       # Add azure only in an Azure-specific env/group
    "pip>=25.3",                      # Added as needed for skypilot launch
    "msrestazure>=0.6.4.post1",
]
excel = ["openpyxl>=3.1.5"]
excel-mac-windows = ["openpyxl>=3.1.5", "xlwings>=0.33.16"]
crm = ["python-dateutil>=2.9.0.post0", "simple-salesforce>=1.12.9"]

[tool.uv.sources]
job-telemetry = { path = "../job-telemetry", editable = true }
