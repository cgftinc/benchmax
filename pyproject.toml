[tool.uv.workspace]
members = [
    "packages/benchmax",
    "packages/castform",
    "examples/*",
]

[tool.uv.sources]
benchmax = { workspace = true }
castform = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.2",
]

# Repo-root ruff config. No package or example declares its own [tool.ruff],
# so this governs the whole workspace tree.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test classes named TestStrategy<N>_<Description>; the underscore separates the
# strategy number from its description and is deliberate.
"packages/castform/tests/unit/traces/test_braintrust_extraction.py" = ["N801"]
