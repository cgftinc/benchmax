[pytest]
testpaths = tests/architecture
asyncio_mode = auto
# importlib mode + pythonpath let one invocation span both packages' suites,
# e.g. `uv run pytest packages/benchmax/tests packages/castform/tests`.
addopts = --import-mode=importlib
pythonpath = packages/benchmax packages/castform

markers =
    slow: Slow-running tests (deselect with '-m "not slow"')
    remote: marks tests that require remote resources (deselect with '-m "not remote"')
    unit: Fast, isolated tests
    integration: Integration tests that hit live external APIs (require credentials; run with -m integration)
