# Local, zero-key configuration. All aliases point to the bundled mock
# OpenAI-compatible upstream by default. Replace these deployments with real
# model servers when moving beyond the integration spike.
model_list:
  # Small route-scoring model. LiteLLM is the stable gateway; swap the
  # OpenAI-compatible upstream from the stock 0.8B checkpoint to a fine-tuned
  # checkpoint later without changing callers or the public alias.
  - model_name: castform-router-0.8b
    litellm_params:
      model: os.environ/CASTFORM_ROUTER_UPSTREAM_MODEL
      api_base: os.environ/CASTFORM_ROUTER_UPSTREAM_BASE_URL
      api_key: os.environ/CASTFORM_ROUTER_UPSTREAM_API_KEY

  # Complete-route aliases used by the job-level router. They all point to the
  # mock upstream in this lab; production maps each alias to its real provider.
  - model_name: claude-route
    litellm_params:
      model: os.environ/CASTFORM_CLAUDE_ROUTE_MODEL
      api_base: os.environ/CASTFORM_CLAUDE_ROUTE_BASE_URL
      api_key: os.environ/CASTFORM_CLAUDE_ROUTE_API_KEY

  - model_name: glm-route
    litellm_params:
      model: os.environ/CASTFORM_GLM_ROUTE_MODEL
      api_base: os.environ/CASTFORM_GLM_ROUTE_BASE_URL
      api_key: os.environ/CASTFORM_GLM_ROUTE_API_KEY

  - model_name: codex-route
    litellm_params:
      model: os.environ/CASTFORM_CODEX_ROUTE_MODEL
      api_base: os.environ/CASTFORM_CODEX_ROUTE_BASE_URL
      api_key: os.environ/CASTFORM_CODEX_ROUTE_API_KEY

  - model_name: llama-route
    litellm_params:
      model: os.environ/CASTFORM_LLAMA_ROUTE_MODEL
      api_base: os.environ/CASTFORM_LLAMA_ROUTE_BASE_URL
      api_key: os.environ/CASTFORM_LLAMA_ROUTE_API_KEY

  # Legacy model-only aliases kept for direct middleware and smoke tests.
  - model_name: cheap-model
    litellm_params:
      model: openai/cheap-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

  - model_name: frontier-model
    litellm_params:
      model: openai/frontier-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

  # Stable public aliases for callers that have already chosen their harness.
  # The hook invokes Qwen and replaces these aliases with a concrete route.
  - model_name: castform-auto
    litellm_params:
      model: openai/cheap-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

  - model_name: castform-auto-codex
    litellm_params:
      model: openai/cheap-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

  - model_name: castform-auto-claude
    litellm_params:
      model: openai/cheap-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

  - model_name: castform-auto-open
    litellm_params:
      model: openai/cheap-model
      api_base: os.environ/MOCK_UPSTREAM_BASE_URL
      api_key: os.environ/MOCK_UPSTREAM_API_KEY

litellm_settings:
  callbacks: castform_router.litellm_callback.castform_auto_router
  # Keep response_format/json_schema intact for the local OpenAI-compatible
  # router model. Silently dropping it lets a small base model free-run.
  drop_params: false
  num_retries: 1
  request_timeout: 120
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
