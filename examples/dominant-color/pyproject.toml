[project]
name = "benchmax-example-dominant-color"
version = "0.1.0"
description = "Multi-turn dominant-color vision environment for Benchmax"
requires-python = "==3.12.*"
dependencies = ["benchmax", "pillow>=10"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
