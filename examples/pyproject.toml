# Standalone uv project so the telestich example can be run without
# installing benchmax globally. Benchmax itself is pulled in editable from
# the parent directory.
#
#     cd core/benchmax/examples
#     uv sync
#     uv run python telestich.py
#
# To target a non-prod environment, set CASTFORM_BASE_DOMAIN (or override
# CASTFORM_PLATFORM_URL / CASTFORM_LLM_URL individually). See benchmax.config.
[project]
name = "benchmax-telestich-example"
version = "0.0.0"
description = "Runnable example of bundling a TelestichEnv with benchmax."
requires-python = "==3.12.*"
dependencies = [
    "benchmax",
    "english_words",
    "openai",
    "pronouncing",
    "wordfreq",
]

[tool.uv.sources]
benchmax = { path = "..", editable = true }
