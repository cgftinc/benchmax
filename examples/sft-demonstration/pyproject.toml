[project]
name = "benchmax-example-sft-demonstration"
version = "0.1.0"
description = "SFT demonstration environment for Benchmax"
requires-python = "==3.12.*"
dependencies = ["benchmax"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sft_demonstration_env"]

[tool.uv.sources]
benchmax = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
