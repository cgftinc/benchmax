[project]
name = "benchmax-example-geo3k"
version = "0.1.0"
description = "Geo3K multimodal environment for benchmax"
requires-python = "==3.12.*"
dependencies = [ "datasets>=4.0.0", "pillow>=10"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
