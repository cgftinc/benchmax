# Standalone uv project so the guess example can be run without
# installing benchmax globally. Benchmax itself is pulled in editable from
# the parent directory.
#
#     cd core/benchmax/examples/guess
#     uv sync
#     CASTFORM_API_KEY=sk_... uv run python launch_guess.py
#
# To target a non-prod environment, set CASTFORM_BASE_DOMAIN (or override
# CASTFORM_PLATFORM_URL). See benchmax.config.
[project]
name = "benchmax-guess-example"
version = "0.0.0"
description = "Launch a GuessEnv training run via the platform HTTP endpoint."
requires-python = "==3.12.*"
dependencies = ["benchmax"]

[tool.uv.sources]
benchmax = { path = "../..", editable = true }
