[project]
name = "benchmax-example-math"
version = "0.1.0"
description = "Minimal arithmetic tool-use environment"
requires-python = "==3.12.*"
dependencies = ["benchmax", "castform", "datasets>=4.0.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["extensions"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
