[project]
name = "benchmax-example-math"
version = "0.1.0"
description = "Arithmetic tool-use environments for Benchmax"
requires-python = "==3.12.*"
dependencies = ["benchmax", "castform", "datasets>=4.0.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# "main" stays installable: the trainer depends on this example for its
# pipeline e2e (math_group_env imports MathEnv from main).
py-modules = ["main", "math_group_env"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
