# Snapshot: Castform 1aed982f2621d87438b3ad095818440a4ea930c5.
# This is the snapshot's simple-optimized.yaml with the GitLab BM25
# post-Harbor A/B parameters and scheduler-owned secrets.
# The bundled environment advertises four searches and enforces three executed
# tool calls, matching the pre-Harbor arm's historical effective behavior.
name: gitlab-bm25-ab-post-harbor-gateway-optimized-pre-harbor-effective-3-tools

resources:
  # replace this infra based on your needs
  infra: azure/centralus
  accelerators: A100-80GB:4
  # infra: denvr
  # accelerators: A100-80GB:8
  disk_size: 512
  image_id: docker:slimerl/slime:nightly-dev-20260707a

workdir:
  url: "https://github.com/castform-ai/castform.git"
  # Pin the optimized task to the same post-Harbor snapshot as task.yaml.
  ref: "1aed982f2621d87438b3ad095818440a4ea930c5"

envs:
  # ── Platform job env (filled by Platform or the first run step) ───────────
  RUN_ID: ""
  USER_ID: ""
  AZURE_CONTAINER_NAME: ""
  AZURE_STORAGE_ACCOUNT: ""
  PLATFORM_API_URL: ""
  LLM_PROXY_URL: ""
  INGEST_SERVICE_PUBLIC_URL: ""
  AUTH_SERVICE_PUBLIC_URL: ""
  CASTFORM_LLM_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_INSECURE: ""
  AUTH_CLIENT_ID: ""
  AUDIENCES: ""
  SCOPES: ""
  TITO_PUBLIC_BASE_URL: ""
  USER_DATA_ARG_SAVE: ""
  USER_DATA_ARG_LOAD: ""

  # ── user-tunable ─────────────────────────────────────────────────────────
  # Disabling fused attention so flash-attn is use. many instabilities with cudnn fused attn (tho faster).
  NVTE_FUSED_ATTN: 0
  ARG_MODEL: "Qwen/Qwen3.5-4B"
  # A/B pins. Turns/tool calls live in the bundled post-Harbor environment.
  RUN_NAME: "gitlab-bm25-ab-post-harbor-gateway-optimized-pre-harbor-effective-3-tools"
  ARG_LR: "4e-6"
  ARG_NUM_EPOCH: "5"
  ARG_N_SAMPLES_PER_PROMPT: "9"
  ARG_N_SAMPLES_PER_EVAL_PROMPT: "9"
  ARG_ROLLOUT_MAX_CONTEXT_LEN: "16384"
  ARG_EVAL_MAX_CONTEXT_LEN: "16384"
  ARG_EVAL_INTERVAL: "5"
  ARG_SAVE_INTERVAL: "5"
  ARG_KL_LOSS_COEF: "0"
  ARG_LORA_RANK: "128"
  ARG_LORA_ALPHA: "256"
  # Where manual launches register (ensure_platform_job_env). Platform-launched
  # jobs arrive fully provisioned, and registration re-stamps this with
  # Platform's canonical value.
  CASTFORM_PLATFORM_URL: "https://api.castform.dev"
  USER_DATA_PATH: "~/user-data/"
  USER_DATA_ARG_ENV_CLS_PATH: ""
  USER_DATA_ARG_ENV_METADATA_PATH: ""
  # Optional blob prefix mirrored to the machine as the env dataset dir.
  USER_DATA_ARG_DATASET_PATH: ""
  # Optional: warm-start from a pre-trained HF PEFT LoRA (adversarial loop / continued training)
  # USER_DATA_ARG_LORA_ADAPTER_PATH: "loras/prev-expt-id/Qwen/Qwen3.5-4B_slime/lora_peft_iter_0000050"

secrets:
  # ── Platform job secrets (filled by Platform or the first run step) ───────
  AUTH_SVC_CLIENT_SECRET: ""
  AZURE_CONTAINER_SAS: ""
  CLOUDFLARE_TUNNEL_TOKEN: ""
  # Injected by the scheduler launch; do not place the key in this YAML.
  WANDB_API_KEY: ""
  # Native SkyPilot reads these values from the caller's local environment.
  CASTFORM_AUTH_TOKEN: ""
  GIT_TOKEN: ""

run: |
  set -e

  _platform_job_env_file=$(mktemp)
  trap 'rm -f "$_platform_job_env_file"' EXIT
  python3 core/trainer/src/trainer/tools/ensure_platform_job_env.py --output "$_platform_job_env_file"
  set -a
  . "$_platform_job_env_file"
  set +a
  rm -f "$_platform_job_env_file"
  trap - EXIT
  unset CASTFORM_AUTH_TOKEN

  _model_download_pid=""
  _blob_download_pid=""
  _git_config_temp=""

  _background_job_is_running() {
    jobs -pr | grep -Fxq "$1"
  }

  _cleanup_background_job() {
    local job_pid="${1:-}"
    if [ -z "$job_pid" ]; then
      return
    fi
    if _background_job_is_running "$job_pid"; then
      pkill -TERM -P "$job_pid" 2>/dev/null || true
      kill "$job_pid" 2>/dev/null || true
      for _ in {1..100}; do
        if ! _background_job_is_running "$job_pid"; then
          break
        fi
        sleep 0.1
      done
      if _background_job_is_running "$job_pid"; then
        pkill -KILL -P "$job_pid" 2>/dev/null || true
        kill -KILL "$job_pid" 2>/dev/null || true
      fi
    fi
    wait "$job_pid" 2>/dev/null || true
  }

  _cleanup_optimized_run() {
    local exit_status="${1:-0}"
    trap - EXIT INT TERM
    _cleanup_background_job "${_blob_download_pid:-}"
    _cleanup_background_job "${_model_download_pid:-}"
    if [ -n "${_git_config_temp:-}" ]; then
      rm -f "$_git_config_temp"
    fi
    return "$exit_status"
  }

  trap '_cleanup_optimized_run "$?"' EXIT
  trap 'exit 130' INT
  trap 'exit 143' TERM

  export PYTHONPATH="$(pwd)/core/trainer/src:${PYTHONPATH:-}"

  _model_download_run_id="${RUN_ID:-$$}"
  export CASTFORM_MODEL_DOWNLOAD_MODEL="$ARG_MODEL"
  export CASTFORM_MODEL_DOWNLOAD_DIR="/root/$ARG_MODEL"
  export CASTFORM_MODEL_DOWNLOAD_STATUS="/tmp/castform-model-download.${_model_download_run_id}.status"
  export CASTFORM_MODEL_DOWNLOAD_LOG="/tmp/castform-model-download.${_model_download_run_id}.log"
  python3 -m trainer.tools.prefetch_model &
  _model_download_pid=$!
  export CASTFORM_MODEL_DOWNLOAD_PID="$_model_download_pid"

  python3 -m trainer.tools.ensure_machine_tools

  if [[ "$ARG_MODEL" == *[Gg]emma*4* ]]; then
    unset NVTE_FUSED_ATTN
  fi

  if [ -d .git ]; then
    _git_config_temp=$(mktemp -t gitconfig.XXXXXX)
    export GIT_CONFIG_GLOBAL="$_git_config_temp"
    if [ -n "$GIT_TOKEN" ]; then
      git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "git@github.com:"
    fi
    git submodule update --init --filter=blob:none --jobs 4 core/benchmax core/slimefork core/megatron-bridge-fork
  fi
  unset GIT_TOKEN

  cd core/trainer
  WORKDIR=$(pwd)

  cp pyproject-optimized.toml pyproject.toml
  cp uv-optimized.lock uv.lock

  # Use only our checked-out Bridge while retaining the Slime image's Megatron Core; both share the megatron namespace.
  export PYTHONPATH="$WORKDIR/../megatron-bridge-fork/src:$WORKDIR:$WORKDIR/src:/root/Megatron-LM:${PYTHONPATH:-}"
  python3 -m trainer.tools.apply_model_runtime_patches --model "$ARG_MODEL"

  # Remove the image's Bridge so the checked-out fork is the only available Bridge distribution.
  python3 -m pip uninstall -y megatron-bridge

  uv venv --system-site-packages --clear
  source .venv/bin/activate

  USER_DATA_PATH="${USER_DATA_PATH:-~/user-data}"
  USER_DATA_PATH="${USER_DATA_PATH/#\~/$HOME}"
  rm -rf "$USER_DATA_PATH" && mkdir -p "$USER_DATA_PATH"
  _download_log="/tmp/job_blob_sync_download.${_model_download_run_id}.log"

  python3 -m trainer.tools.sync.job_blob_sync download \
    --account-name "$AZURE_STORAGE_ACCOUNT" \
    --sas-token "$AZURE_CONTAINER_SAS" \
    --container "$AZURE_CONTAINER_NAME" \
    --local-root "$USER_DATA_PATH" \
    --required-files \
      "$USER_DATA_ARG_ENV_CLS_PATH" \
      "$USER_DATA_ARG_ENV_METADATA_PATH" \
    --required-prefixes \
      "$USER_DATA_ARG_DATASET_PATH" \
    ${USER_DATA_ARG_LOAD:+--load-checkpoint-path "$USER_DATA_ARG_LOAD"} \
    > "$_download_log" 2>&1 &
  _dl_pid=$!
  _blob_download_pid="$_dl_pid"

  # Keep the image's CUDA-matched Torch. Our Slime and Bridge forks are
  # installed explicitly below so their source and ordering are deterministic.
  uv sync \
    --no-install-package torch \
    --no-install-package slime \
    --no-install-package megatron-bridge \
    --prerelease allow

  _runtime_check_before="/tmp/castform-runtime-verify-before-repair.json"
  _runtime_check_after="/tmp/castform-runtime-verify-after-repair.json"
  # Detect repairable image-package mismatches.
  python3 -m trainer.tools.runtime_probe verify-dependencies \
    --output "$_runtime_check_before" \
    --component torch \
    --component nccl \
    --component cudnn \
    --component sglang-router

  if python3 -m trainer.tools.runtime_probe needs-repair "$_runtime_check_before" torch; then
    uv pip install --reinstall --no-deps \
      "https://download.pytorch.org/whl/cu129/torch-2.11.0%2Bcu129-cp312-cp312-manylinux_2_28_x86_64.whl"
  fi
  if python3 -m trainer.tools.runtime_probe needs-repair "$_runtime_check_before" nccl; then
    uv pip install --reinstall --no-deps "nvidia-nccl-cu12==2.30.4"
  fi
  if python3 -m trainer.tools.runtime_probe needs-repair "$_runtime_check_before" cudnn; then
    uv pip install --reinstall --no-deps "nvidia-cudnn-cu12==9.16.0.29"
  fi
  if python3 -m trainer.tools.runtime_probe needs-repair "$_runtime_check_before" sglang-router; then
    uv pip install --reinstall --no-deps https://github.com/zhuzilin/sgl-router/releases/download/v0.3.2-5f8d397/sglang_router-0.3.2-cp38-abi3-manylinux_2_28_x86_64.whl
  fi

  # These forks are trainer-owned, not optional repairs. Install Bridge last:
  # both it and the image's Megatron Core contribute to the megatron namespace.
  uv pip install --no-deps -e "$WORKDIR/../slimefork"
  uv pip install --no-deps --no-build-isolation -e "$WORKDIR/../megatron-bridge-fork"

  # Validate the repaired Python environment.
  python3 -m trainer.tools.runtime_probe verify-dependencies \
    --output "$_runtime_check_after" \
    --deep-imports \
    --no-require-cuda \
    --strict

  if ! wait $_dl_pid; then
    _blob_download_pid=""
    cat "$_download_log"
    exit 1
  fi
  _blob_download_pid=""

  history -c 2>/dev/null; rm -f ~/.bash_history ~/.zsh_history

  python3 -m trainer.tools.run_training_optimized
  wait "$_model_download_pid"
  _model_download_pid=""
