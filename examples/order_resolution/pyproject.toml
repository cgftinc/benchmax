[project]
name = "benchmax-example-order-resolution"
version = "0.1.0"
description = "Neon-backed order-resolution RL environment"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.17.0,<2",
    "benchmax",
    "castform",
    "httpx>=0.28.0,<1",
    "psycopg[binary,pool]>=3.2.0,<4",
    "sqlalchemy[asyncio]>=2.0.0,<3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["order_resolution"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
