services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: order_resolution
      POSTGRES_PASSWORD: order_resolution_test
      POSTGRES_USER: order_resolution
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_resolution -d order_resolution"]
      interval: 1s
      timeout: 3s
      retries: 30

