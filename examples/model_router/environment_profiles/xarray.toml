schema_version = 1
name = "xarray"
repo = "xarray"
repo_url = "https://github.com/pydata/xarray"
base_image = "python:3.12-slim"
apt_packages = []
install_cmd = "pip install --no-cache-dir -e .[accel,io,parallel] h5py matplotlib pytz pytest hypothesis pytest-xdist pytest-asyncio pytest-mypy-plugins==3.2.0"
post_install_cmd = "pip install --no-cache-dir pytest==8.4.2 numpy==2.3.5 pandas==2.3.3 scipy==1.16.3 zarr==3.1.3 numcodecs==0.16.3 tzdata"

[timeouts]
build_sec = 900
agent_sec = 1800
verifier_sec = 600
