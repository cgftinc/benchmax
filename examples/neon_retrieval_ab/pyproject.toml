[project]
name = "benchmax-example-neon-retrieval-ab"
version = "0.1.0"
description = "Paired offline A/B of neon retrieval modes (bm25 / vector / hybrid) on one query set"
requires-python = "==3.12.*"
dependencies = ["benchmax", "castform[rag,neon]", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]
