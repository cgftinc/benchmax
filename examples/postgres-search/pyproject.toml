[project]
name = "benchmax-example-postgres-search"
version = "0.1.0"
description = "PostgreSQL-backed search environments for Benchmax"
requires-python = "==3.12.*"
dependencies = ["benchmax", "castform[rag]"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["postgres_search_env"]

[tool.uv.sources]
benchmax = { workspace = true }
castform = { workspace = true }

[dependency-groups]
dev = [
    "cloudpickle>=3.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.2",
]
