[project]
name = "benchmax-example-telestich"
version = "0.1.0"
description = "Telestich poetry environment for benchmax"
requires-python = "==3.12.*"
dependencies = [
    "english-words",
    "openai",
    "pronouncing",
    "wordfreq",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.14.2"]
